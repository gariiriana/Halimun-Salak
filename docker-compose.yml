version: '3.8'

services:
  # Development service: Runs Next.js with hot reload enabled
  app-dev:
    container_name: halimun-salak-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      # Mount source code from host to container
      - .:/app
      # Avoid mounting host's local node_modules inside container
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      # Enable watchpack polling to ensure hot reload works reliably on Windows/Mac hosts
      - WATCHPACK_POLLING=true
    restart: always

  # Production service: Runs the optimized multi-stage production container
  app-prod:
    container_name: halimun-salak-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    restart: always
